version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: usta_bul_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ustabul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ustabul_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ustabul_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - ustabul_network

  redis:
    image: redis:7-alpine
    container_name: usta_bul_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ustabul_network

volumes:
  postgres_data:
  redis_data:

networks:
  ustabul_network:
    driver: bridge
